<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Consumo de Combustível</title>    
</head>
<body>
    <main>
        <header>
            <h1>Calculadora de Consumo de Combustivel</h1>
            <h2>Calcule o consumo de combustível do seu veículo durante uma viagem!</h2>
        </header>

        <section aria-labelledby="titulo-calculo">
            <h3 id="titulo-calculo">
                Insira abaixo as informações solicitadas:
            </h3>

            <form id="formConsumo">
                <div>
                    <label for="distancia">
                        Distacia percorrida (km):
                    </label>
                    <input type="number" id="distancia" min="0.01" step="any" placeholder="Digite a distância" required>
                </div>

                <div>
                    <label for="consumoMedio">
                        Consumo médio (km/L):
                    </label>
                    <input type="number" id="consumoMedio" min="0.01" step="any" placeholder="Digite o consumo" required>
                </div>

                <div>
                    <label for="preco">
                        Preço do combustível (R$/L):
                    </label>
                    <input type="number" id="preco" min="0.01" step="any" placeholder="Preço em R$" required>
                </div> 
                
                <button type="button" onclick="calcularViagem()">Calcular consumo</button>
            </form>

            <div>
                <p id="combustivelCons">Combustível consumido: 0,00 L</p>
                <p id="custoViagem">Custo da viagem: R$ 0,00</p>
                <p id="custoMedio">Custo médio por KM: R$ 0,00</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>    
</body>
</html>
